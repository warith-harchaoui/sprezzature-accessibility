[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-accessibility"
version = "1.0.0"
description = "Static HTML accessibility linter: 14 WCAG/WAI rules decidable from source, stdlib only, CI-ready."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"}]
keywords = ["accessibility", "a11y", "wcag", "html", "linter", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]
lang = ["langdetect>=1.0.9"]

[project.scripts]
sprezzature-accessibility-lint = "sprezzature_accessibility_scripts.lint_a11y:main"

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-accessibility"

[tool.setuptools]
packages = ["sprezzature_accessibility", "sprezzature_accessibility_scripts"]

[tool.setuptools.package-dir]
"sprezzature_accessibility_scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
