[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-accessibility"
version = "1.2.1"
description = "Static HTML accessibility linter: 20 WCAG/WAI rules decidable from source, time-based media included, stdlib only, CI-ready."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["accessibility", "a11y", "wcag", "html", "linter", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # The command line, and the only one since 2026-10-25. The lint half of
    # this package carried **no** dependencies at all, which is what made it
    # cheap enough for a pre-commit hook, and click was an extra because only
    # one of the two front doors needed it. With argparse gone there is no
    # parser left that ships with Python, so an optional click would mean a
    # `pip install sprezzature-accessibility` whose own commands do not run.
    #
    # The per-tool script `sprezzature-accessibility-lint` still needs nothing
    # beyond this, so the pre-commit case stays millisecond-cheap.
    "click>=8.1",
]

[project.optional-dependencies]
# The drafting half of this package — the "make" to the lint's "audit".
#
# An extra, not a hard dependency, and that is the whole design. The lint is
# stdlib-only on purpose: it runs in milliseconds in a minimal CI container
# and in a pre-commit hook, which is the reason anyone reaches for it over
# axe-core. Putting a model client in `dependencies` would make every
# pre-commit install pull a CLI framework and an LLM helper to run a check
# that never calls either.
#
#   pip install sprezzature-accessibility          # the audit, 0 dependencies
#   pip install "sprezzature-accessibility[alt]"   # audit + drafting
alt = [
    "click>=8.1",
    # Every LLM/VLM call across sprezzature-* routes through
    # best_engine_ai_helper.llm.chat; alt_from_ollama imports it at module
    # level, so the drafter cannot start without it.
    "best-engine-ai-helper>=0.4.0",
]
dev = ["pytest>=8.0", "ruff"]
lang = ["langdetect>=1.0.9"]
# HTTP surface (sprezzature_accessibility/api.py): the linter over HTTP, so
# a CI job or an editor plugin in any language can check markup.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface: the same routes republished as agent tools, via fastapi-mcp.
mcp = [
    "sprezzature-accessibility[api]",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 (the latest as of 2026-08) declares mcp>=1.12.0 with
    # no upper bound, but calls mcp's Server(name, description) positionally
    # -- mcp 2.0.0 made `description` keyword-only, so an unconstrained
    # resolve breaks FastApiMCP(...) at construction time (verified: pip
    # happily installs mcp 2.2.0 alongside fastapi-mcp 0.4.0, and
    # `sprezzature_accessibility.mcp` then raises TypeError on import). Pin below
    # 2.0 until fastapi-mcp ships a fix.
    "mcp<2.0",
]

[project.scripts]
# The two front doors, over the same four tools and the same table
# (sprezzature_accessibility/cli.py). argparse because it is in the standard
# library and therefore always there; click because its sub-commands carry the
# shape without hand-rolling it.
#
# `sprezzature-accessibility` is also the command the suite's SKILL.md has
# been naming since the monorepo split. Until 1.2.0 nothing installed it, so
# an agent following that contract ran a command that did not exist and found
# out at the shell. A guard in the monorepo now asks the question of all nine.
make-a11y = "sprezzature_accessibility.cli:main"
sprezzature-accessibility = "sprezzature_accessibility.cli:main"
sprezzature-accessibility-mcp = "sprezzature_accessibility.mcp:main"
sprezzature-accessibility-lint = "sprezzature_accessibility_scripts.lint_a11y:main"
sprezzature-accessibility-text-spacing = "sprezzature_accessibility_scripts.text_spacing_preset:main"
# The drafting half, behind the [alt] extra. Two parsers over one engine, in
# the house spelling: `make-X` is argparse, `sprezzature-X` the click twin.
make-alt = "sprezzature_accessibility.alt_cli:main"
sprezzature-accessibility-alt = "sprezzature_accessibility.alt_cli:main"
sprezzature-accessibility-install-alt = "sprezzature_accessibility_scripts.install_alt_ai:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-accessibility"

[tool.setuptools]
packages = ["sprezzature_accessibility", "sprezzature_accessibility_scripts"]

[tool.setuptools.package-data]
"sprezzature_accessibility_scripts" = ["prompts/*.yaml", "requirements-alt-text.txt"]

[tool.setuptools.package-dir]
"sprezzature_accessibility_scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not eval"` keeps the LLM-output quality suite out of the default run:
# it needs a running Ollama and a pulled model, so on a machine without one it
# skips every test and reports green for work it never did — and on a machine
# *with* one it makes the default suite slow and non-deterministic. Opt in
# with `pytest -m eval`.
#
# Missing until 2026-10-19, together with the marker declaration: `eval` was
# an unknown mark here, which pytest warns about and then ignores, so the
# seven tests under tests/eval/ ran in every default run. The sibling that
# received the other half of these tests when the monorepo split,
# sprezzature-publish, had the config; this repository did not, and the
# pre-push step added here earlier the same day claimed in its own comment
# that the default run excluded them. `--strict-markers` is the half that
# would have said so out loud.
# No `-q` here, on purpose. `-q` in `addopts` plus the `-q` a human types --
# or the one the pre-push hook passes -- is `-qq`, and at that verbosity pytest
# drops its last line: the run ends on the progress bar with no "N passed" at
# all. Four of the ten repositories were in that state, so `pytest -q` gave a
# verdict in six of them and a silence in four. Failures still printed, so
# nothing was ever wrong; a run that will not say what it did is still the
# wrong default for a suite whose whole argument is that a check must speak.
addopts = '-ra --strict-markers -m "not eval"'
markers = [
    "eval: LLM-output quality tests under tests/eval/ (need Ollama running)",
]
