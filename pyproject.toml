[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-accessibility"
version = "1.4.4"
description = "Static HTML accessibility linter: 20 WCAG/WAI rules decidable from source, time-based media included, CI-ready; drafts the missing alt text with a local vision model."
readme = "README.md"
# The upper bound is not housekeeping: it is inherited, and it was being
# promised away. `wallet-helper` — a base dependency — declares
# `requires-python <3.14,>=3.10` at every version this package's floor
# permits, so an installer on 3.14 cannot resolve it, and could not resolve
# this package either. The manifest said `>=3.10` with no bound, which is a
# promise the dependencies cannot keep.
#
# Nothing caught it. `sprezzature-audio` and `sprezzature-publish` carry a
# guard for exactly this shape and the other nine bricks do not, so the one
# brick where the inheritance actually bites was the one with no guard —
# measured on 2026-11-02 by reading the simple index for every base
# dependency's floor version.
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["accessibility", "a11y", "wcag", "html", "linter", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # The command line, and the only one since 2026-10-25. The lint half of
    # this package carried **no** dependencies at all, which is what made it
    # cheap enough for a pre-commit hook, and click was an extra because only
    # one of the two front doors needed it. With argparse gone there is no
    # parser left that ships with Python, so an optional click would mean a
    # `pip install sprezzature-accessibility` whose own commands do not run.
    #
    # The per-tool script `sprezzature-accessibility-lint` still needs nothing
    # beyond this, so the pre-commit case stays millisecond-cheap.
    "click>=8.1",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 1
    # dependency, so `pip install sprezzature-accessibility` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    #
    # The floor is 1.11.0 since 2026-11-05, read off the index. The drafter
    # passes the server it names to `chat(engine=...)`, which exists from
    # 1.1.0; and every release from 1.0.0 to 1.10.0 caps `os-helper` below 3
    # or 4, so none of them installs beside a suite brick that needs
    # `os-helper>=4`. 1.11.0 is the first that has both. 0.4.0 resolved only
    # because it named `os-helper>=1.5.0` uncapped, and it had no `engine=`.
    "best-engine-ai-helper>=1.11.0",
    # The floor is 1.3.2 and it is load-bearing, not housekeeping. Up to and
    # including 1.3.1, `SqliteLedger.__init__` ran `PRAGMA journal_mode=WAL`,
    # which needs exclusive access to the file; SQLite answers a journal-mode
    # change with SQLITE_BUSY *without consulting the busy handler*, so the
    # connection's thirty-second timeout did not cover that one statement.
    # Three processes drafting the same image — the case the ledger exists for —
    # left one dead on "database is locked", measured here at 3 failures in 15
    # runs by `tests/test_two_drafts_of_one_image_cost_one_call.py`.
    #
    # 1.3.2 reads the mode before writing it. Until it was published this
    # package carried its own retry in `scripts/alt_from_ollama.py`; raising
    # the floor is what removed it, which was the condition that
    # `tests/test_the_draft_cache_survives_its_own_cold_start.py` asserted and
    # the reason that file is gone.
    "wallet-helper>=1.3.2,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langdetect>=1.0.9",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
    # `--resize` (1024 px by default) downscales an image before the drafter
    # sends it to the model. Pillow was undeclared until 2026-11-04, so on a
    # default install the flag was accepted and did nothing: the original
    # bytes went out at full size, and nothing said so. Imported only by the
    # drafter, never on the lint path.
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
# One front door with two spellings, `make-a11y` and
# `sprezzature-accessibility`, over the four tools in one table
# (sprezzature_accessibility/_tools.py). It is click, the only parser of the
# front door since the argparse twin was removed on 2026-10-25.
#
# `sprezzature-accessibility` is also the command the suite's SKILL.md has
# been naming since the monorepo split. Until 1.2.0 nothing installed it, so
# an agent following that contract ran a command that did not exist and found
# out at the shell. A guard in the monorepo now asks the question of all nine.
make-a11y = "sprezzature_accessibility.cli:main"
sprezzature-accessibility = "sprezzature_accessibility.cli:main"
sprezzature-accessibility-mcp = "sprezzature_accessibility.mcp:main"
sprezzature-accessibility-lint = "sprezzature_accessibility_scripts.lint_a11y:main"
sprezzature-accessibility-text-spacing = "sprezzature_accessibility_scripts.text_spacing_preset:main"
# The drafting half, in the base install since 2026-11-01. `make-alt` and
# `sprezzature-accessibility-alt` are two spellings of one click command.
make-alt = "sprezzature_accessibility.alt_cli:main"
sprezzature-accessibility-alt = "sprezzature_accessibility.alt_cli:main"
sprezzature-accessibility-install-alt = "sprezzature_accessibility_scripts.install_alt_ai:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-accessibility"

[tool.setuptools]
packages = ["sprezzature_accessibility", "sprezzature_accessibility_scripts"]

[tool.setuptools.package-data]
"sprezzature_accessibility_scripts" = ["prompts/*.yaml", "requirements-alt-text.txt"]

[tool.setuptools.package-dir]
"sprezzature_accessibility_scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not eval"` keeps the LLM-output quality suite out of the default run:
# it needs a running Ollama and a pulled model, so on a machine without one it
# skips every test and reports green for work it never did — and on a machine
# *with* one it makes the default suite slow and non-deterministic. Opt in
# with `pytest -m eval`.
#
# Missing until 2026-10-19, together with the marker declaration: `eval` was
# an unknown mark here, which pytest warns about and then ignores, so the
# seven tests under tests/eval/ ran in every default run. The sibling that
# received the other half of these tests when the monorepo split,
# sprezzature-publish, had the config; this repository did not, and the
# pre-push step added here earlier the same day claimed in its own comment
# that the default run excluded them. `--strict-markers` is the half that
# would have said so out loud.
# No `-q` here, on purpose. `-q` in `addopts` plus the `-q` a human types --
# or the one the pre-push hook passes -- is `-qq`, and at that verbosity pytest
# drops its last line: the run ends on the progress bar with no "N passed" at
# all. Four of the ten repositories were in that state, so `pytest -q` gave a
# verdict in six of them and a silence in four. Failures still printed, so
# nothing was ever wrong; a run that will not say what it did is still the
# wrong default for a suite whose whole argument is that a check must speak.
addopts = '-ra --strict-markers -m "not eval"'
markers = [
    "eval: LLM-output quality tests under tests/eval/ (need Ollama running)",
]
