<svg xmlns="http://www.w3.org/2000/svg" width="980" height="802" viewBox="0 0 980 802" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="accessibility-hiw-title accessibility-hiw-desc"><title id="accessibility-hiw-title">Comment fonctionne sprezzature-accessibility</title><desc id="accessibility-hiw-desc">Schéma de flux. En haut, le HTML que vous tenez alimente deux voies. La voie de gauche fabrique : elle lit la page autour d'une image, interroge un modèle de vision local, et réécrit l'attribut alt dans la page. La voie de droite contrôle : elle lit la source sans navigateur, tranche vingt règles, et rend ses constats en texte ou en JSON, avec le code de sortie 1 dès qu'il y en a un. Les deux voies se rejoignent en un seul résultat, une page qu'un lecteur d'écran lit et qu'un clavier atteint.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="802" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">Comment fonctionne sprezzature-accessibility</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">Vingt règles qu'aucun navigateur n'a besoin d'exécuter, et le texte alternatif qu'elles réclament.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">Le HTML que vous tenez</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">un fichier, un dossier, ou une page écrite par quelqu'un d'autre. Pas de compilation, pas de serveur, pas de chargement.</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Fabriquer : écrire ce qui manque</text><rect x="36" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Lire la page autour de l'image</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">le titre au-dessus, la légende en dessous, la phrase qu'elle</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">illustre</text><path d="M254,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,358 L254,366 L258,358" fill="#C7C7CC"/><rect x="36" y="366" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="396" font-size="16" font-weight="600" fill="#1D1D1F">Interroger un modèle de vision sur votre machine</text><text x="54" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">Ollama, en local. Aucune image n'est envoyée ailleurs,</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">une capture d'écran privée le reste.</text><path d="M254,452 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,468 L254,476 L258,468" fill="#C7C7CC"/><rect x="36" y="528" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,540 v61" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="557" font-size="16" font-weight="600" fill="#1D1D1F">Un texte alternatif, écrit dans la page</text><text x="65" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">rédigé selon l'arbre de décision du W3C, et soumis à votre</text><text x="65" y="598" font-size="13.5" font-weight="400" fill="#6E6E73">lecture avant publication</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Contrôler : vingt règles, lues dans le texte</text><rect x="508" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Parcourir la source</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">aucun navigateur ne s'ouvre, aucun JavaScript ne tourne,</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">aucun arbre de document n'est construit</text><path d="M726,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,358 L726,366 L730,358" fill="#C7C7CC"/><rect x="508" y="366" width="436" height="120" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="396" font-size="16" font-weight="600" fill="#1D1D1F">Trancher chaque règle</text><text x="526" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">alt absent, champ sans étiquette, bouton vide, div cliquable,</text><text x="526" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">dialogue sans fermeture, hiérarchie de titres, état porté par</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">la seule couleur, animation sans variante apaisée, vidéo sans</text><text x="526" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">sous-titres</text><path d="M726,486 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,502 L726,510 L730,502" fill="#C7C7CC"/><rect x="508" y="510" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,522 v78" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="540" font-size="16" font-weight="600" fill="#1D1D1F">Des constats, en texte ou en JSON</text><text x="537" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">code de sortie 1 au premier constat, ce qui en fait</text><text x="537" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">une barrière avant commit. Six règles sur vingt portent aussi leur</text><text x="537" y="598" font-size="13.5" font-weight="400" fill="#6E6E73">réparation.</text><path d="M254,613 V634 H490 V647" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,647 L490,655 L494,647" fill="#C7C7CC"/><path d="M726,613 V634 H490 V647" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,647 L490,655 L494,647" fill="#C7C7CC"/><rect x="36" y="655" width="908" height="85" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,667 v61" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="684" font-size="16" font-weight="600" fill="#1D1D1F">Une page qu'un lecteur d'écran lit, qu'un clavier atteint, et qu'un réglage de mouvement réduit apaise</text><text x="65" y="708" font-size="13.5" font-weight="400" fill="#6E6E73">Ce que seule une page rendue montre, l'ordre du focus et le contraste sur un vrai fond, reste du ressort d'axe-core, Pa11y ou Lighthouse.</text><text x="65" y="726" font-size="13.5" font-weight="400" fill="#6E6E73">Ceci est la première barrière, la rapide, pas leur remplacement.</text><text x="36" y="766" font-size="13.5" font-weight="400" fill="#6E6E73">Bibliothèque standard seule à l'exécution. Quelques millisecondes, dans un conteneur minimal, ce qui en fait un bon crochet de pre-commit.</text></svg>
