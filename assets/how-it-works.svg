<svg xmlns="http://www.w3.org/2000/svg" width="980" height="767" viewBox="0 0 980 767" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="accessibility-hiw-title accessibility-hiw-desc"><title id="accessibility-hiw-title">How sprezzature-accessibility works</title><desc id="accessibility-hiw-desc">Flow diagram. At the top, the HTML you are holding feeds two lanes. The left lane makes: it reads the page around an image, asks a local vision model, and writes the alt attribute back into the page. The right lane audits: it scans the source text with no browser, decides twenty rules, and returns findings as text or JSON with exit code 1 on any finding. Both lanes meet in one outcome, a page a screen reader can read and a keyboard can reach.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="767" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-accessibility works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">Twenty rules a browser never has to run, and the alt text they ask for.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">The HTML you are holding</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">one file, a folder, or a page somebody else wrote. No build step, no server, no page load.</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Make: write what is missing</text><rect x="36" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Read the page around the image</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">the heading above it, the caption under it, the sentence it</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">illustrates</text><path d="M254,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,358 L254,366 L258,358" fill="#C7C7CC"/><rect x="36" y="366" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="396" font-size="16" font-weight="600" fill="#1D1D1F">Ask a vision model on your own machine</text><text x="54" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">Ollama, locally. No image is uploaded anywhere, so a private</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">screenshot stays private.</text><path d="M254,452 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,468 L254,476 L258,468" fill="#C7C7CC"/><rect x="36" y="493" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,505 v61" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="522" font-size="16" font-weight="600" fill="#1D1D1F">The alt text, written into the page</text><text x="65" y="546" font-size="13.5" font-weight="400" fill="#6E6E73">drafted against the W3C decision tree, and put in front of you</text><text x="65" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">to read before it ships</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Audit: twenty rules, read from the text</text><rect x="508" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Scan the source</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">no browser opens, no JavaScript runs, no document tree</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">is built</text><path d="M726,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,358 L726,366 L730,358" fill="#C7C7CC"/><rect x="508" y="366" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="396" font-size="16" font-weight="600" fill="#1D1D1F">Decide each rule</text><text x="526" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">missing alt, unlabelled input, empty button, clickable div, dialog</text><text x="526" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">with no close, heading order, state shown by colour alone,</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">animation with no reduced-motion peer, video with no captions</text><path d="M726,469 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,485 L726,493 L730,485" fill="#C7C7CC"/><rect x="508" y="493" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,505 v61" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="522" font-size="16" font-weight="600" fill="#1D1D1F">Findings, as text or JSON</text><text x="537" y="546" font-size="13.5" font-weight="400" fill="#6E6E73">exit 1 on any finding, so it gates a commit. Six of the twenty</text><text x="537" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">also carry a mechanical repair.</text><path d="M254,578 V599 H490 V612" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,612 L490,620 L494,612" fill="#C7C7CC"/><path d="M726,578 V599 H490 V612" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,612 L490,620 L494,612" fill="#C7C7CC"/><rect x="36" y="620" width="908" height="85" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,632 v61" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="649" font-size="16" font-weight="600" fill="#1D1D1F">A page a screen reader can read, a keyboard can reach, and a reduced-motion setting can calm</text><text x="65" y="673" font-size="13.5" font-weight="400" fill="#6E6E73">What only a rendered page shows, focus order and contrast against a real background, stays for axe-core, Pa11y or Lighthouse. This</text><text x="65" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">is the fast first gate, not a replacement for them.</text><text x="36" y="731" font-size="13.5" font-weight="400" fill="#6E6E73">Standard library only at runtime. Milliseconds, in a minimal container, which is what makes it worth a pre-commit hook.</text></svg>
