name: ci

# Gentle, deterministic gate: ruff lint + pytest on the supported Python
# versions. No model calls, no network. Intentionally minimal.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Une poussée qui en suit une autre annule la première : sans ce groupe, deux
  # commits à une minute d'intervalle font tourner deux matrices de trois
  # versions de Python jusqu'au bout, et seul le second compte. Quatre dépôts
  # de la suite l'avaient, six ne l'avaient pas.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
      # UNE SEULE version de Python sous la suite complete. La matrice en
      # faisait tourner plusieurs, c'est-a-dire le meme travail multiplie par
      # autant de coureurs pour attraper des differences de version que les
      # tests ne regardent pas. Le plancher garde sa preuve : le job `floor`
      # installe et importe le paquet sur la plus ancienne version promise,
      # ce qui est la promesse faite a `pip install`, pour une fraction du
      # cout.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package editable. There are no extras left to name: on
          # 2026-11-01 everything this package does moved into the base
          # install. This step did not get slower for it -- measured, under a
          # minute before and after, where `sprezzature-audio` went to two
          # minutes and `sprezzature-figures` to six.
          #
          # **wallet-helper is still named, and now only for its floor.** It
          # is a base dependency, so the install would bring it anyway; the
          # constraint is here because `wallet-helper 1.3.2` carries a fix
          # this repository's own test found, and until that release is on
          # PyPI this runner resolves **1.3.1** and keeps the defect.
          #
          # The defect: `SqliteLedger.__init__` ran `PRAGMA journal_mode=WAL`,
          # and SQLite answers a journal-mode change with SQLITE_BUSY without
          # consulting the busy handler -- so three interpreters opening a
          # cold ledger at once could leave one dead on `database is locked`.
          # `tests/test_two_drafts_of_one_image_cost_one_call.py` spawns
          # exactly those three, and it is what found it: measured 3 failures
          # in 15 runs before the fix, 0 in 15 after.
          #
          # So this line is the handle: raise the floor to `>=1.3.2` the day
          # it publishes, and that test stops being able to flake here. Until
          # then CI can fail it about one run in five, and the cause is
          # upstream and already fixed at the source.
          pip install -e "." "wallet-helper>=1.3,<2" -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # The type half of the gate. Added after running mypy by hand found
      # the same real defect in all six packages: mcp.py's two `main`
      # definitions, the missing-extra fallback and the real one, took
      # different arguments. Once, on one version: this is a gate, not a
      # matrix. scripts/ is a separate invocation because those modules
      # import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_accessibility
          mypy scripts
      - name: Pytest
        run: pytest -q

  floor:
    name: Plancher (3.10 installe et importe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python` est une promesse faite a qui lance `pip install` : sur
    # cette version, le paquet s'installe et s'importe. Installer et importer,
    # deliberement pas la suite de tests — les tests ont le droit d'employer des
    # nouveautes de langage, et faire echouer le plancher la-dessus ferait
    # echouer un job pour une raison etrangere a la promesse.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sprezzature_accessibility"
